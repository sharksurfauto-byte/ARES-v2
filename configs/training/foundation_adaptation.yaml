training:
  output_dir: "checkpoints/foundation_adapter"
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  num_train_epochs: 1
  max_steps: 200
  warmup_ratio: 0.05
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  seed: 42
  fp16: true
  bf16: false
  use_ddp: true

peft:
  peft_type: "LORA"
  task_type: "CAUSAL_LM"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
